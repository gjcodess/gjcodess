name: Update Contributions Graph

on:
  schedule:
    - cron: '0 16 * * *' # Runs daily at 12:00 AM (midnight) Philippine Time (UTC+8)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Contribution Graph SVG
        run: |
          node scripts/generate_contributions.js
          node scripts/generate_stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.svg github_stats.svg stats.svg languages.svg
          if git diff --staged --quiet; then
            echo "No changes detected in SVG cards."
          else
            git commit -m "📊 update contribution graph & stats cards [skip ci]"
            git push
          fi
