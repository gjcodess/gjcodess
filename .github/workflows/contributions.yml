name: Update Contributions Graph

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Profile SVG Cards
        run: |
          node scripts/generate_header.js
          node scripts/generate_neofetch.js
          node scripts/generate_tech_stack.js
          node scripts/generate_projects.js
          node scripts/generate_abono_banner.js
          node scripts/generate_contributions.js
          node scripts/generate_stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add header.svg contributions.svg neofetch.svg tech_stack.svg projects.svg abono_banner.svg github_stats.svg stats.svg languages.svg
          if git diff --staged --quiet; then
            echo "No changes detected in SVG cards."
          else
            git commit -m "📊 update profile SVG cards [skip ci]"
            git push
          fi
