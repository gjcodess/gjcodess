<svg xmlns="http://www.w3.org/2000/svg" width="425" height="235" viewBox="0 0 425 235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="sbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F0E1A"/>
      <stop offset="1" stop-color="#090812"/>
    </linearGradient>
    <mask id="bar-mask2">
      <rect x="0" y="0" width="380" height="9" rx="4.5" fill="white"/>
    </mask>
  </defs>

  <rect width="425" height="235" rx="12" fill="url(#sbg2)"/>
  <rect x="0.5" y="0.5" width="424" height="234" rx="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="0" y1="30" x2="425" y2="30" stroke="#ffffff" stroke-opacity="0.35"/>

  <circle cx="20" cy="15.0" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="15.0" r="5" fill="#27c93f"/>
  <text x="212.5" y="19.0" fill="#9ca3af" font-size="12" text-anchor="middle">gjcodess@github: ~$ gh languages</text>

  <g opacity="0" transform="translate(0,5)">
    <text x="22" y="58" fill="#00FF99" font-size="13.5" font-weight="700">Most Used Languages</text>
    
    <g transform="translate(22, 74)" mask="url(#bar-mask2)">
      <rect x="0.00" y="0" width="243.24" height="9" fill="#f1e05a"/><rect x="243.24" y="0" width="89.34" height="9" fill="#563d7c"/><rect x="332.58" y="0" width="31.20" height="9" fill="#3178c6"/><rect x="363.78" y="0" width="14.25" height="9" fill="#e34c26"/><rect x="378.03" y="0" width="1.86" height="9" fill="#3572A5"/><rect x="379.89" y="0" width="0.11" height="9" fill="#58a6ff"/><rect x="380.00" y="0" width="0.00" height="9" fill="#89e051"/>
    </g>

    <!-- Column 1 -->
    
    <circle cx="28" cy="107" r="4.5" fill="#f1e05a"/>
    <text x="40" y="111" fill="#c9d1d9" font-size="12">JavaScript</text>
    <text x="145" y="111" fill="#7d8590" font-size="11.5">64.01%</text>
    <circle cx="28" cy="133" r="4.5" fill="#563d7c"/>
    <text x="40" y="137" fill="#c9d1d9" font-size="12">CSS</text>
    <text x="145" y="137" fill="#7d8590" font-size="11.5">23.51%</text>
    <circle cx="28" cy="159" r="4.5" fill="#3178c6"/>
    <text x="40" y="163" fill="#c9d1d9" font-size="12">TypeScript</text>
    <text x="145" y="163" fill="#7d8590" font-size="11.5">8.21%</text>
    <circle cx="28" cy="185" r="4.5" fill="#e34c26"/>
    <text x="40" y="189" fill="#c9d1d9" font-size="12">HTML</text>
    <text x="145" y="189" fill="#7d8590" font-size="11.5">3.75%</text>

    <!-- Column 2 -->
    
    <circle cx="225" cy="107" r="4.5" fill="#3572A5"/>
    <text x="237" y="111" fill="#c9d1d9" font-size="12">Python</text>
    <text x="340" y="111" fill="#7d8590" font-size="11.5">0.49%</text>
    <circle cx="225" cy="133" r="4.5" fill="#58a6ff"/>
    <text x="237" y="137" fill="#c9d1d9" font-size="12">Nix</text>
    <text x="340" y="137" fill="#7d8590" font-size="11.5">0.03%</text>
    <circle cx="225" cy="159" r="4.5" fill="#89e051"/>
    <text x="237" y="163" fill="#c9d1d9" font-size="12">Shell</text>
    <text x="340" y="163" fill="#7d8590" font-size="11.5">0%</text>

    <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.25s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
